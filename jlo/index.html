<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Jannie — Papa is weer op reis</title>
  <meta name="description" content="Vier kinderen onder de vijf, papa weer op reis, en tóch de Dam tot Dam rennen. Een korte film over @janniefromtheblog, gemaakt van 150 vormen, matrix3d, kinetische typografie en een gesynthetiseerde soundtrack.">
  <meta name="theme-color" content="#fff7f3">
  <link rel="preload" href="fonts/dmserif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/dmserif-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jost-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%23ff5a4f%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="intro">
  <div id="stage" aria-hidden="true"></div>
  <div id="type" aria-live="polite"></div>

  <div id="hint">
    <span class="hint-title">Papa is weer op reis.</span>
    <span class="hint-sub">Klik om te starten &middot; geluid aan</span>
  </div>

  <div id="controls">
    <button id="btn-play" aria-label="Afspelen / pauze (spatie)">
      <svg class="i-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="3.2" height="14" rx="1.2"/></svg>
      <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.6v12.8c0 .8.9 1.3 1.6.8l10-6.4c.6-.4.6-1.3 0-1.7l-10-6.4C8.9 4.3 8 4.8 8 5.6z"/></svg>
    </button>
    <button id="btn-mute" aria-label="Geluid uit (m)">
      <svg class="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg class="i-muted" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5z"/><path d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-replay" aria-label="Opnieuw (r)">
      <svg viewBox="0 0 24 24"><path d="M5.5 12a6.5 6.5 0 1 0 2-4.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 4.5v4.3h4.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="progress"><div id="bar"></div></div>

  <script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
